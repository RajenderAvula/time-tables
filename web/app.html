.mwrap{overflow:auto;padding:0 4px}.mgrid{display:grid;grid-template-columns:repeat(7,minmax(46px,1fr));gap:4px;min-width:330px}

function parseVcf(t){

  const un=v=>v.replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1').trim();

const WDN=['sun','mon','tue','wed','thu','fri','sat'],MONN=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

function parseQuick(raw){

  const take=(re,fn)=>{const m=s.match(re);if(!m)return false;s=s.replace(re,' ');fn(m);return true};
  s=s.replace(/^\s*(please\s+)?(add|create|new|schedule|remind me to|set)\s+(a\s+|an\s+|the\s+)?/i,' ');
  take(/\s#([a-z0-9_-]+)(?=\s)/i,m=>{const k=m[1].toLowerCase(),c=(S.cats||[]).find(c=>c.name.toLowerCase().startsWith(k));if(c)r.cat=c.id});
  // time

  if(!take(/\s(?:at\s+)?([01]?\d|2[0-3]):([0-5]\d)(?=\s)/,m=>{r.time=hhmm(+m[1],+m[2])}))

  if(!take(/\s(midnight)(?=\s)/i,()=>{r.time='00:00'}))
  take(/\sat\s+(\d{1,2})(?=\s)/i,m=>{let hr=+m[1];if(hr>=1&&hr<=6)hr+=12;if(hr<24)r.time=hhmm(hr,0)});

  take(/\snext week(?=\s)/i,()=>{r.date=plus(7)})||
  take(/\s(next |this )?(sun|mon|tue|wed|thu|fri|sat)[a-z]*(?=\s)/i,m=>{const wd=WDN.indexOf(m[2].toLowerCase());let k=(wd-base.getDay()+7)%7;if(/next/i.test(m[1]||'')&&k<7)k+=k===0?7:0;if(/next/i.test(m[1]||'')&&k>0&&k<7&&false)k+=7;r.date=plus(k)})||
  take(/\s(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*(?:\s+(\d{4}))?(?=\s)/i,m=>{r.date=dm(+m[1],MONN.indexOf(m[2].toLowerCase())+1,m[3]?+m[3]:0)})||
  take(/\s(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})(?:st|nd|rd|th)?(?=\s)/i,m=>{r.date=dm(+m[2],MONN.indexOf(m[1].toLowerCase())+1,0)})||
  take(/\s(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?(?=\s)/,m=>{let yy=m[3]?+m[3]:0;if(yy&&yy<100)yy+=2000;r.date=dm(+m[1],+m[2],yy)});

$('#bk').onclick=backupDlg;

/* ---------- wiring ---------- */
$('#prev').onclick=()=>$('.gridwrap').scrollBy({left:-7*COLW,behavior:'smooth'});
$('#next').onclick=()=>$('.gridwrap').scrollBy({left:7*COLW,behavior:'smooth'});
$('.gridwrap').addEventListener('scroll',onGridScroll,{passive:true});
$('#today').onclick=()=>scrollToDate(new Date(),true);
$('#jump').addEventListener('change',e=>{if(e.target.value)scrollToDate(parseISO(e.target.value),true)});
$('#addslot').onclick=()=>{const l=S.slots[S.slots.length-1];let s='08:00',e='09:00';if(l){const hh=parseInt(l.e)||8;s=l.e;e=pad(Math.min(23,hh+1))+l.e.slice(2)}
  S.slots.push({id:'s'+uid(),s,e});slotsChanged()};
$('#eclose').onclick=closeEditor;$('#eup').onclick=goUp;
$('#eback').onclick=()=>{const id=ui.hist.pop();if(id&&N(id))openNode(id);else renderEditor()};
$('#etree').onclick=()=>{ui.tree=!ui.tree;$('#sheet').classList.toggle('tree-on',ui.tree)};
$('#tcopy').onclick=()=>{if(ed.node)copyText(outline(treeRoot(ed.node).id,0,[]).join('\n'))};
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
  const sc=$('.scrib');if(sc){sc.done();return}
  const md=[...document.querySelectorAll('.mback')].pop();if(md){md.close();return}
  const sfz=$('#sfull');if(sfz){sfz.close();return}
  const zb=$('#zbox');if(zb){zb.close();return}
  if(document.body.classList.contains('ttfull')&&$('#sheet').hidden&&(!$('#gtree')||$('#gtree').hidden)){ttFull(false);return}
  for(const id of ['inbox','trash','revise','review','month','agenda']){const o=document.getElementById(id);if(o&&!o.hidden){o.hidden=true;return}}
  if($('#gtree')&&!$('#gtree').hidden){$('#gtree').hidden=true;return}
  if(!$('#ring').hidden){stopRing();return}
  if(!$('#pomo').hidden){$('#pomo').hidden=true;return}
  if($('#gpanel')&&!$('#gpanel').hidden){$('#gpanel').hidden=true;return}
  if(!$('#contacts').hidden){$('#contacts').hidden=true;return}
  if(!$('#search').hidden){$('#search').hidden=true;return}
  if(!$('#sheet').hidden)closeEditor()});

/* ---------- clock: alarms and pomodoro ---------- */
setInterval(()=>{
  if(!S)return;const now=Date.now();
  if($('#ring').hidden){for(const n of Object.values(S.nodes)){
    if(n.snz&&now>=n.snz){n.snz=null;dirty();ring(n);break}
    if(n.alarm&&!n.fired&&now>=n.alarm){n.fired=true;if(n.rep)advance(n);dirty();ring(n);renderGrid();if(ed.node)renderEditor();break}}}
  digestTick();wrapTick();medTick();revTick();stTick();geoHits();actTick();actDone();const p=pm();
  if(p.running&&p.endAt-now<=0){beep(3);notify(PH[p.phase]+' finished',p.phase==='focus'?'Time for a break.':'Back to focus.');pomoNext(true);$('#pomo').hidden=false}
  pomoRender()},500);

$('#undobtn').onclick=undo;
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){const a=document.activeElement;if(a&&/^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)||(a&&a.isContentEditable))return;e.preventDefault();undo()}});
async function gcFiles(){if(!DB.db)return;try{const keys=await DB.tx('files','readonly',s=>s.getAllKeys());const used=new Set();
  for(const n of Object.values(S.nodes))fileIds(n).forEach(f=>used.add(f));
  for(const k of keys||[])if(!used.has(k))await DB.del('files',k).catch(()=>{})}catch(e){}}
/* ---------- boot ---------- */
(async function boot(){
  await DB.open();
  try{S=await DB.get('kv','state')}catch(e){S=null}
  if(!S||!S.slots){seed();flush()}
  migrate(S);dirty();if(!S.pomo)S.pomo=pomoDefault();
  const p=S.pomo;if(p.running&&p.endAt-Date.now()<=0){p.running=false;p.remain=0}
  themeBoot();gcFiles();geoSync();syncPomoCfg();buildGrid();renderTTBar();trashPurgeOld();renderStrip();qaInit();setTimeout(updateChecksBadge,700);setInterval(updateChecksBadge,60000);setTimeout(()=>{recRun();updateNextBar();geoHits();actDone();nativeSync(true);phoneSetupOnce()},900);setInterval(()=>{recRun()},1800000);setInterval(updateNextBar,10000);renderBelow();scrollToDate(new Date(),false);pomoRender();
  try{chan=new BroadcastChannel('nested-timetable');chan.onmessage=async()=>{
    if(document.activeElement&&/TEXTAREA|INPUT/.test(document.activeElement.tagName))return;
    try{const s=await DB.get('kv','state');if(s){S=s;linkTT(S);syncPomoCfg();renderGrid();renderTTBar();renderStrip();renderInboxBtn();renderBelow();if(ed.node&&N(ed.node))renderEditor();else if(ed.node)closeEditor()}}catch(e){}}}catch(e){}
  stat('Saved');
})();
})();
</script>
