name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the job publish the APK as a GitHub release

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle itself, so no gradlew wrapper has to be committed
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Rebuild the page bundle
        run: python3 tools/make_index.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TimeTables-debug.apk

      # Download from the run page for 30 days (also works on pull requests)
      - uses: actions/upload-artifact@v4
        with:
          name: TimeTables-debug
          path: TimeTables-debug.apk
          retention-days: 30

      # Always-current download link on the Releases page (main branch only)
      - name: Publish as the latest debug release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --cleanup-tag --yes || true
          gh release create debug-latest TimeTables-debug.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Debug build (latest)" \
            --notes "Debug APK built from commit ${{ github.sha }}. For testing only: signed with the debug key."
